name = "Ply"
grammar = "ply"
path_suffixes = ["ply", "d.ply"]
line_comments = [". ", ".. "]
tab_size = 2
hard_tabs = false
brackets = [
  { start = "(", end = ")", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = true },
  { start = "<", end = ">", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
